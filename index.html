--ui:Tajawal,'Segoe UI',Arial,sans-serif;--disp:Anton,Impact,'Arial Narrow',sans-serif;color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden;background:#3a0309;color:#fff;font-family:var(--ui);-webkit-user-select:none;user-select:none;touch-action:manipulation}
.screen{position:fixed;inset:0;display:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.screen.on{display:flex}
#home{background:var(--bg) center/cover no-repeat,#b80f1b;align-items:flex-end;justify-content:center;padding-bottom:max(3dvh,env(safe-area-inset-bottom,0px))}
.cta{position:relative;margin-bottom:2dvh;padding:2.2dvh 6vw;border:0;border-radius:999px;cursor:pointer;text-align:center;color:var(--red2);
background:linear-gradient(#fff,#ffe9b0);box-shadow:0 0 0 4px var(--red),0 0 0 8px var(--gold),0 12px 30px rgba(0,0,0,.55);animation:pulse 2s ease-in-out infinite}
.cta b{display:block;font:400 clamp(26px,5.5dvh,52px)/1 var(--disp);letter-spacing:1px;text-transform:uppercase}
.cta span{display:block;margin-top:.6dvh;font:800 clamp(14px,2.4dvh,22px) var(--ui)}
@keyframes pulse{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.cta{animation:none}}
.hot{position:absolute;left:0;top:0;width:90px;height:90px;border:0;background:transparent;cursor:default}
#play{flex-direction:column;align-items:center;justify-content:center;gap:1.5dvh;background:linear-gradient(rgba(70,0,8,.55),rgba(70,0,8,.55)),var(--bg) center/cover no-repeat}
#play::before{content:"";position:absolute;inset:0;backdrop-filter:blur(14px) brightness(.85)}
#play>*{position:relative}
.ttl{margin:0;font:400 clamp(26px,5.5dvh,52px)/1 var(--disp);text-transform:uppercase;font-style:italic;letter-spacing:1px;
background:linear-gradient(#fff 30%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(90,0,10,.7))}
.logo{position:absolute;left:2.5vw;top:2.5dvh;width:clamp(70px,16dvh,150px);aspect-ratio:1;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--red),0 0 0 6px var(--gold),0 8px 18px rgba(0,0,0,.5)}
.logo img{width:78%;display:block}
.arena{position:relative;width:min(66dvh,86vw);aspect-ratio:1;margin-right:5dvh}
canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 16px 24px rgba(0,0,0,.55))}
.pointer{position:absolute;right:-5dvh;top:50%;width:0;height:0;transform:translateY(-50%);z-index:2;border-top:3dvh solid transparent;border-bottom:3dvh solid transparent;border-right:7dvh solid var(--gold);filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.hub{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:5px solid #fff;cursor:pointer;color:#fff;font:400 clamp(16px,3.6dvh,30px) var(--disp);text-transform:uppercase;
background:radial-gradient(circle at 35% 30%,#ff4a52,var(--red2));box-shadow:0 0 0 5px var(--gold),0 8px 18px rgba(0,0,0,.55)}
.hub:disabled{filter:grayscale(.7) brightness(.8);cursor:default}
:is(.hub,.btn,.cta,.hot):focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(25,0,5,.82);z-index:10;padding:16px}
.modal.on{display:flex}
.card{width:min(100%,520px);max-height:92dvh;overflow:auto;text-align:center;background:#fff;color:var(--ink);border-radius:24px;padding:3dvh 24px;border:6px solid var(--red);box-shadow:0 0 0 5px var(--gold),0 20px 50px rgba(0,0,0,.6)}
.card h2{margin:0;font:400 clamp(34px,7dvh,64px)/1.05 var(--disp);color:var(--red);text-transform:uppercase}
.prize{margin:1.5dvh 0 0;font:800 clamp(22px,4dvh,36px)/1.2 var(--ui)}
.card p{margin:1dvh 0;font-size:clamp(15px,2.4dvh,20px)}
.code{display:inline-block;margin:1.5dvh 0 0;padding:.8dvh 22px;border:3px dashed var(--red);border-radius:12px;font:400 clamp(26px,4.5dvh,40px) var(--disp);letter-spacing:4px}
.btn{width:100%;margin-top:2dvh;padding:1.8dvh 18px;border:0;border-radius:14px;cursor:pointer;font:400 clamp(18px,3dvh,26px) var(--disp);letter-spacing:1px;text-transform:uppercase;color:#fff;background:var(--red);box-shadow:0 4px 0 #6d0810}
.btn.alt{background:#f2e7e7;color:var(--red2);box-shadow:0 4px 0 #cdb7b7}
.btn:active{transform:translateY(2px)}
.log{text-align:left;font-size:15px;margin:10px 0}.log div{padding:6px 0;border-bottom:1px solid #eee}
#fx{position:fixed;inset:0;pointer-events:none;z-index:11}
.cta{overflow:hidden}
.cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.9),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{left:130%}}
.hand{margin:0;font:400 clamp(30px,6dvh,54px)/1 'Mrs Saint Delafield','Brush Script MT',cursive;color:var(--gold);text-shadow:0 2px 6px rgba(60,0,8,.7)}
.arena::before{content:"";position:absolute;inset:-24%;border-radius:50%;background:repeating-conic-gradient(rgba(255,226,154,.3) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 68%);mask:radial-gradient(circle,#000 30%,transparent 68%);animation:rays 26s linear infinite}
@keyframes rays{to{transform:rotate(360deg)}}
canvas{position:relative;z-index:1}
.pointer,.hub{z-index:3}
.arena.go .pointer{animation:tick .14s ease-in-out infinite}
@keyframes tick{50%{transform:translateY(-50%) rotate(-9deg)}}
.hub:not(:disabled){animation:beat 1.6s ease-in-out infinite}
@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.08)}}
.card{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.emoji{font-size:clamp(48px,10dvh,90px);line-height:1;margin-bottom:.5dvh}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
@media (prefers-reduced-motion:reduce){#fx{display:none}}
</style>
</head>

  <h1 class="ttl">Croise les doigts… et tourne !</h1>
  <p class="hand">Joyeux anniversaire Urbain Five · 11 ans de sourires</p>
  <div class="arena">
    <div class="pointer"></div>
    <canvas id="wheel" width="900" height="900" aria-label="Roue des cadeaux"></canvas>
    <button class="hub" id="spin">GO !</button>
  </div>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="card">
    <div class="emoji" id="me"></div><h2 id="mt"></h2>
    <div class="prize" id="md"></div>
    <div class="code" id="mc" hidden></div>
    <p id="mh" hidden>Montre cet écran à l'accueil pour récupérer ton cadeau. Profites-en bien, tu l'as mérité !</p>
    <button class="btn" id="again" hidden>Je retente ma chance 🍀</button>
    <button class="btn" id="back">Merci ! Retour à l'accueil</button>
  </div>
</div>
<div class="modal" id="staff">
  <div class="card">
    <h2>Gagnants</h2>
    <div class="log" id="list"></div>
    <button class="btn alt" id="copy">Copier la liste</button>
    <button class="btn alt" id="clear">Vider la liste</button>
    <button class="btn" id="sx">Fermer</button>
  </div>
</div>
<canvas id="fx"></canvas>

<script>
(function(){
var P=[
 {t:["+7 JOURS","GYM"],w:12,c:"#e8141c",tx:"#fff",n:"+7 jours de gym offerts"},
 {t:["+15 JOURS","GYM"],w:8,c:"#ffffff",tx:"#b00d15",n:"+15 jours de gym offerts"},
 {t:["+1 MOIS","GYM"],w:3,c:"#e8141c",tx:"#fff",n:"+1 mois de gym offert"},
 {t:["BON D'ACHAT","200 DH"],w:4,c:"#f5c04a",tx:"#7a0510",n:"Bon d'achat de 200 DH"},
 {t:["3H GAMING","GRATUIT"],w:9,c:"#ffffff",tx:"#b00d15",n:"3 heures de gaming gratuites"},
 {t:["ACADEMY","-15% FOOT"],w:2,c:"#e8141c",tx:"#fff",n:"-15% sur l'Academy du foot"},
 {t:["+1 MATCH","SOIR"],w:8,c:"#ffffff",tx:"#b00d15",n:"+1 match de foot le soir"},
 {t:["+1 MATCH","MATIN"],w:8,c:"#e8141c",tx:"#fff",n:"+1 match de foot le matin"},
 {t:["REPAS RESTO","OFFERT"],w:3,c:"#ffffff",tx:"#b00d15",n:"Un repas offert au resto"},
 {t:["BOISSON","OFFERTE"],w:12,c:"#e8141c",tx:"#fff",n:"Une boisson offerte"},
 {t:["TRY","AGAIN"],w:14,c:"#2a0509",tx:"#f5c04a",n:null}
];
var N=P.length,A=Math.PI*2/N,rot=0,busy=false,cv=document.getElementById("wheel"),g=cv.getContext("2d"),S=cv.width,R=S/2;
var $=function(i){return document.getElementById(i)},KEY="uf11-log";

function draw(){
 g.clearRect(0,0,S,S);g.save();g.translate(R,R);
 var rg=g.createLinearGradient(-R,-R,R,R);rg.addColorStop(0,"#fff0c0");rg.addColorStop(.5,"#e0a21f");rg.addColorStop(1,"#fff0c0");
 g.beginPath();g.arc(0,0,R-4,0,7);g.fillStyle=rg;g.fill();
 g.beginPath();g.arc(0,0,R-20,0,7);g.fillStyle="#e8141c";g.fill();
 g.beginPath();g.arc(0,0,R-60,0,7);g.fillStyle="#fff";g.fill();
 g.save();g.rotate(rot);var r=R-66;
 for(var i=0;i<N;i++){
  g.beginPath();g.moveTo(0,0);g.arc(0,0,r,i*A,(i+1)*A);g.closePath();
  g.fillStyle=P[i].c;g.fill();g.lineWidth=3;g.strokeStyle="#f5c04a";g.stroke();
  g.save();g.rotate((i+.5)*A);g.textAlign="right";g.textBaseline="middle";g.fillStyle=P[i].tx;
  g.font="41px Anton,Impact,sans-serif";g.fillText(P[i].t[0],r-24,-21);
  g.font="33px Anton,Impact,sans-serif";g.fillText(P[i].t[1],r-24,21);g.restore();
 }
 g.restore();
 for(var k=0;k<24;k++){var a=k*Math.PI*2/24,x=Math.cos(a)*(R-40),y=Math.sin(a)*(R-40);
  var gr=g.createRadialGradient(x-3,y-3,1,x,y,10);gr.addColorStop(0,"#fff");gr.addColorStop(1,"#808080");
  g.beginPath();g.arc(x,y,9,0,7);g.fillStyle=gr;g.fill();}
 g.restore();
}
function pick(){var s=0,i;for(i=0;i<N;i++)s+=P[i].w;var x=Math.random()*s;for(i=0;i<N;i++){x-=P[i].w;if(x<0)return i}return N-1}
function code(){var c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",o="UF11-";for(var i=0;i<4;i++)o+=c[Math.floor(Math.random()*c.length)];return o}
function getLog(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function setLog(l){try{localStorage.setItem(KEY,JSON.stringify(l))}catch(e){}}
function go(id){$("home").classList.toggle("on",id==="home");$("play").classList.toggle("on",id==="play")}

$("start").onclick=function(){go("play");$("spin").disabled=false;$("spin").focus()};
function spin(){
 if(busy)return;busy=true;$("spin").disabled=true;document.querySelector(".arena").classList.add("go");
 var i=pick(),center=(i+.5)*A+(Math.random()-.5)*A*.7;
 var cur=((rot%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
 var target=rot+Math.PI*2*(6+Math.floor(Math.random()*3))+(((-center-cur)%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
 var start=rot,t0=performance.now(),D=5500;
 (function f(now){var p=Math.min((now-t0)/D,1),e=1-Math.pow(1-p,4);rot=start+(target-start)*e;draw();
  if(p<1)return requestAnimationFrame(f);busy=false;document.querySelector(".arena").classList.remove("go");setTimeout(function(){end(i)},500);})(t0);
}
function end(i){
 var pr=P[i],win=!!pr.n,c=null;
 if(win){c=code();var l=getLog();l.push({time:new Date().toLocaleString("fr-FR"),prize:pr.n,code:c});setLog(l);confetti()}
 var W=["Bravo !","Jackpot !","Yes, c'est pour toi !","Quelle chance !"],T=["Oh, presque !","Si près du but !"];$("mt").textContent=win?W[Math.floor(Math.random()*W.length)]:T[Math.floor(Math.random()*T.length)];$("me").textContent=win?"🎉":"🍀";
 $("md").textContent=win?pr.n:"La chance adore les persévérants. Retente, ça peut basculer d'un tour à l'autre !";
 $("mc").hidden=!win;$("mc").textContent=c||"";$("mh").hidden=!win;$("again").hidden=win;
 $("modal").classList.add("on");(win?$("back"):$("again")).focus();
}
$("spin").onclick=spin;$("wheel").onclick=function(){if(!$("spin").disabled)spin()};
$("again").onclick=function(){$("modal").classList.remove("on");$("spin").disabled=false;$("spin").focus()};
$("back").onclick=function(){$("modal").classList.remove("on");go("home");$("start").focus()};

var taps=0,tt;$("hot").onclick=function(){taps++;clearTimeout(tt);tt=setTimeout(function(){taps=0},1500);
 if(taps>=5){taps=0;renderLog();$("staff").classList.add("on")}};
function renderLog(){var l=getLog(),b=$("list");b.textContent="";
 if(!l.length){b.textContent="Aucun gagnant pour le moment.";return}
 l.slice().reverse().forEach(function(o){var d=document.createElement("div");d.textContent=o.code+" · "+o.prize+" · "+o.time;b.appendChild(d)})}
$("copy").onclick=function(){try{navigator.clipboard.writeText(getLog().map(function(o){return[o.time,o.prize,o.code].join(" | ")}).join("\n"));$("copy").textContent="Copié !"}catch(e){$("copy").textContent="Copie impossible"}};
$("clear").onclick=function(){if(confirm("Vider toute la liste ?")){setLog([]);renderLog()}};
$("sx").onclick=function(){$("staff").classList.remove("on");$("copy").textContent="Copier la liste"};

function confetti(){
 var c=$("fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 var cols=["#e8141c","#fff","#f5c04a","#3b82f6","#a855f7","#22c55e","#ec4899"],ps=[];
 for(var i=0;i<170;i++)ps.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length]});
 var t0=performance.now();
 (function f(n){x.clearRect(0,0,c.width,c.height);
  ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});
  if(n-t0<4500)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(t0);
}
draw();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
})();
</script>
</body>
